# ======================================================================================
# Kookaburra settings
# Precedence: command-line arguments > -Dkookaburra.* system properties > this file > defaults.
# Config.load() reads ./kookaburra.properties; Studio reads the copy next to its jar (bin/kookaburra.properties).
# Sizes accept KB / MB / GB suffixes.
# ======================================================================================

# ---- Database engine ------------------------------------------------------------------
# Size at which the in-memory segment is frozen and flushed
kookaburra.mem-segment-bytes=64MB
# Upper bound of one on-disk segment (hard limit 1.5GB on JDK 17; merges are built in memory, so keep it moderate)
kookaburra.segment-max-bytes=512MB
# Number of similar-size segments merged by one compaction
kookaburra.compaction-fan-in=8
# A segment whose deleted rows reach this share of its rows is rewritten on its own to reclaim the space
# (fully deleted segments are dropped without a rewrite; db.compact() rewrites every segment with deletes)
kookaburra.compaction-garbage-ratio=0.3
# Segments per collection above which writers are slowed down
kookaburra.max-segments=64
# Bloom filter false-positive rate for OID lookups
kookaburra.bloom-fpp=0.01
# SYNC = writes return after fsync of the WAL; ASYNC = after the OS write
kookaburra.durability=SYNC
# Extra time the write sequencer waits for more writes to share one WAL fsync (microseconds; 0 = never wait)
kookaburra.group-commit-micros=200

# ---- Kookaburra Studio (kookaburra-face) ----------------------------------------------
# Database directory opened at start-up.
#   empty            -> "data" in the directory of kookaburra-face.jar (default)
#   relative path    -> resolved against the directory of kookaburra-face.jar, e.g. ../shared-db
#   absolute path    -> used as is, e.g. /var/lib/kookaburra or D:\\kookaburra\\data
# The command line option --data=<dir> overrides this setting.
kookaburra.data=

# Log directory (studio.log, rolled daily / at 10 MB, 14 days kept).
#   empty -> "logs" in the directory of kookaburra-face.jar; relative paths are resolved against that directory
kookaburra.log-dir=
# Log level: ERROR, WARN, INFO, DEBUG, TRACE
kookaburra.log-level=INFO
# Default theme: NEON, DRACULA, NORD_DARK, NORD_LIGHT, PRIMER_DARK, PRIMER_LIGHT, CUPERTINO_DARK, CUPERTINO_LIGHT
kookaburra.theme=NEON
# Rows per page in the data grid and the OQL console
kookaburra.page-size=50

# ---- Engine internals (tuning) --------------------------------------------------------
# Most write batches the sequencer applies per WAL fsync (group commit size)
kookaburra.sequencer-max-group=512
# AUTO index: build postings when cardinality <= documents / this ratio
kookaburra.auto-postings-ratio=16
# Range lookups OR at most this many postings, otherwise they scan ordinals
kookaburra.postings-or-max=64
# Pending flushes + merges above which writer threads wait (back-pressure)
kookaburra.write-backlog=10
# Threads that flush in-memory segments and run compactions
kookaburra.flush-threads=2

# ---- Vector search ---------------------------------------------------------------------
# Fields declared with @Vector(dim = N) get an HNSW graph per segment for approximate nearest-neighbour search
# (built when a segment is flushed or merged; the in-memory segment is searched exactly).
# Neighbours per node on the upper graph layers (the bottom layer keeps twice as many); more = better recall, larger graph
kookaburra.vector-m=16
# Candidate list size while inserting a vector into the graph; more = better graph, slower flushes
kookaburra.vector-ef-construction=100
# Candidates a search keeps per segment (at least k); more = better recall, slower queries.
# A query can override it with nearest(...).numCandidates(n), or search exactly with exact()
kookaburra.vector-ef-search=100
# Segments with fewer vectors than this get no graph: an exact scan is about as fast
kookaburra.vector-index-min-rows=2000

# ---- Embeddings (text to vector) ------------------------------------------------------
# Turns text into vectors for nearest(field, "text", k), OQL EMBED('text') and Studio's "From text" button.
#   ollama -> a local Ollama server (https://ollama.com); pull the model first: ollama pull nomic-embed-text
#   none   -> no embedder (text searches report that none is configured)
# Nothing is contacted until the first embedding, so this costs nothing when unused.
kookaburra.embedder=ollama
# Ollama address
kookaburra.embedder-url=http://localhost:11434
# Embedding model; its dimension must match the @Vector(dim = N) fields it is used with
# (nomic-embed-text: 768, mxbai-embed-large: 1024, bge-m3: 1024, qwen3-embedding:0.6b: 1024, qwen3-embedding:4b: 2560)
kookaburra.embedder-model=nomic-embed-text
# Longest wait for one embedding request (the first one also loads the model)
kookaburra.embedder-timeout=60s

# Reranking: nearest(...).rerank(field) re-scores the closest candidates against the query text with a model that
# reads both (more accurate order for search and RAG, a few hundred ms per candidate on a laptop).
#   ollama -> the model judges "does this document answer the query?" (yes / no probability, as Qwen3-Reranker)
#   none   -> rerank() reports that no reranker is configured
kookaburra.reranker=ollama
kookaburra.reranker-url=http://localhost:11434
# An instruct or reranker model, e.g. qwen3:4b, qwen3:1.7b (faster), qwen3.5:9b (better)
kookaburra.reranker-model=qwen3:4b
kookaburra.reranker-timeout=120s

# ---- Transactions (docs/transaction-design.md) -----------------------------------------
# Multi-statement transactions (db.begin / db.inTransaction). Off by default: every write commits directly
# (autocommit) and the write path keeps no conflict history. true enables transactions (see tx-isolation).
kookaburra.transactions=false
# Open transactions older than this are rolled back (ms / s / m / h; 0 = no limit)
kookaburra.tx-timeout=60s
# Encoded bytes one transaction may buffer before commit
kookaburra.tx-max-bytes=100MB
# Retries of db.inTransaction(...) after a ConflictException
kookaburra.tx-retries=3
# Isolation of db.begin() / db.inTransaction(...) without explicit TxOptions: READ_COMMITTED, SNAPSHOT or SERIALIZABLE
kookaburra.tx-isolation=SNAPSHOT
# Conflict-table entries (about 32 bytes each) before the oldest open transaction is evicted
kookaburra.tx-conflict-table-max=2000000

# ---- Kookaburra Studio: console and demo ----------------------------------------------
# Rows per page in the OQL console
kookaburra.console-page-size=100
# Customers generated for the demo database (products: 30, purchases: 3 per customer)
kookaburra.demo-customers=250
